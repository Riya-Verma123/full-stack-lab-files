<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Navigation Menu</title>
    <style>
        /* Basic styling so the nested menu is easy to see */
        nav ul {
            list-style-type: none;
        }
        nav ul ul {
            margin-left: 20px;
        }
        nav a {
            text-decoration: none;
            color: darkblue;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Learning Portal</h1>
    </header>

    <!-- NAV: Nested list-based menu with absolute URLs -->
    <nav aria-label="Main Navigation">
        <ul>
            <li><a href="https://www.w3.org/">W3C Standards</a></li>

            <li>Learning Resources
                <!-- Nested (sub) menu -->
                <ul>
                    <li><a href="https://developer.mozilla.org/">MDN Web Docs</a></li>
                    <li><a href="https://www.freecodecamp.org/">freeCodeCamp</a></li>
                </ul>
            </li>

            <li>Practice Platforms
                <ul>
                    <li><a href="https://www.geeksforgeeks.org/">GeeksforGeeks</a></li>
                    <li><a href="https://leetcode.com/">LeetCode</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <main>
        <p>Select a link from the navigation menu above to visit external learning resources.</p>
    </main>

</body>
</html>
